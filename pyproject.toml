[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spiking-braille-dataset"
version = "1.0.0"
description = "PyTorch Dataset for the reading-braille tactile event dataset"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "requests",
    "torch",
    "tonic",
]

[tool.setuptools]
packages = ["braille_dataset"]

[tool.setuptools.package-data]
braille_dataset = ["splits.json"]
